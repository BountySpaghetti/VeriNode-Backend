groups:
  - name: verinode-incident-response
    rules:
      - alert: VeriNodeCriticalPathLatencyP99High
        expr: histogram_quantile(0.99, sum(rate(http_server_duration_bucket[5m])) by (le, service)) > 0.1
        for: 2m
        labels:
          severity: critical
          runbook_id: critical-path-latency
        annotations:
          summary: Critical path P99 latency above 100ms
          runbook: docs/runbooks/incident-response-automation.md
      - alert: VeriNodeIncidentAutomationPagerDutyFailures
        expr: increase(verinode_incident_pagerduty_trigger_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: PagerDuty trigger failures detected for incident automation
          runbook: docs/runbooks/incident-response-automation.md
