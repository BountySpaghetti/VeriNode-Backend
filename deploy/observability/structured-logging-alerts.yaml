groups:
  - name: verinode-structured-logging
    rules:
      - alert: VeriNodeLogIngestionFailures
        expr: rate(otelcol_receiver_refused_log_records[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: VeriNode structured log records are being refused
          description: Investigate collector capacity, schema errors, or downstream exporter failures.
      - alert: VeriNodeHighErrorLogRate
        expr: sum(rate(log_records_total{service_name="verinode-backend",severity_text=~"ERROR|FATAL"}[5m])) > 5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: VeriNode error log rate is elevated
          description: Error or fatal structured logs exceeded the operational threshold.
      - alert: VeriNodeCriticalPathLatencyRegression
        expr: histogram_quantile(0.99, sum(rate(http_server_duration_seconds_bucket{service_name="verinode-backend"}[5m])) by (le)) > 0.1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: VeriNode P99 critical path latency exceeds 100ms
          description: Roll back the canary or shift traffic away from the green deployment.
