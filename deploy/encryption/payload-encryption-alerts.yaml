apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: payload-encryption-alerts
spec:
  groups:
    - name: payload-encryption
      rules:
        - alert: PayloadEncryptionFailures
          expr: sum(rate(payload_encryption_failures_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Sensitive payload encryption or decryption failures detected
        - alert: PayloadEncryptionP99LatencyHigh
          expr: histogram_quantile(0.99, sum(rate(payload_encryption_operation_latency_ms_bucket[5m])) by (le, operation)) > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Sensitive payload encryption P99 latency is above 100 ms
